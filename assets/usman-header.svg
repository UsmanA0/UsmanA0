<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc">
  <title id="title">Usman — Python backend</title>
  <desc id="desc">Светлая надпись Usman и объёмная буква U цвета лайма на тёмном фоне.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#73827d" opacity=".42"/>
    </pattern>
    <linearGradient id="ink" x2="1" y2=".18" gradientUnits="objectBoundingBox">
      <stop stop-color="#151b22"/>
      <stop offset="1" stop-color="#222e30"/>
    </linearGradient>
    <path id="u" d="M0 0h38v75c0 24 14 39 38 39s38-15 38-39V0h38v75c0 44-29 75-76 75S0 119 0 75Z"/>
    <clipPath id="edge"><rect width="960" height="232" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <rect width="960" height="232" fill="url(#ink)"/>
    <path fill="url(#dots)" d="M588 0h372v232H588z"/>
    <g transform="translate(721 57) skewX(-12)" fill="#263633" stroke="#8baa7c" stroke-width="1.3" stroke-linejoin="round">
      <use href="#u" transform="translate(24 4)"/>
      <use href="#u" transform="translate(20 1)"/>
      <use href="#u" transform="translate(16 -2)"/>
      <use href="#u" transform="translate(12 -5)"/>
      <use href="#u" transform="translate(8 -8)"/>
      <use href="#u" transform="translate(4 -11)"/>
      <use href="#u" transform="translate(0 -14)" fill="#ceffa2" stroke="#e4ffca"/>
    </g>
    <text x="48" y="124" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="92" letter-spacing="-4" fill="#f0f4ed">Usman</text>
    <path d="M53 169h26" stroke="#ceffa2" stroke-width="3"/>
    <text x="94" y="178" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="29" fill="#c5d3cb">Python backend</text>
  </g>
</svg>
